name: Sonar - Create Quality Gate and Associate Project

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/sonar-create-quality-gate.yml'
      - 'sonar/gate.xml'
  workflow_dispatch: {}

env:
  SONAR_HOST: https://sonarqube.us
  SONAR_ORG: gourabd1ms

jobs:
  create-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xmlstarlet
        run: sudo apt-get update -y && sudo apt-get install -y xmlstarlet

      - name: Create or look up quality gate
        id: create
        run: |
          NAME=$(xmlstarlet sel -t -v '/qualityGate/name' sonar/gate.xml)
          RESP=$(curl -s -u "${{ secrets.SONAR_ENT_TOKEN }}:" -X POST \
            "$SONAR_HOST/api/qualitygates/create" \
            --data-urlencode "name=$NAME" \
            --data-urlencode "organization=$SONAR_ORG")
          echo "create: $RESP"
          GATE_ID=$(echo "$RESP" | jq -r '.id // empty')
          if [ -z "$GATE_ID" ]; then
            echo "Gate not created (likely already exists), looking it up"
            GATE_ID=$(curl -s -u "${{ secrets.SONAR_ENT_TOKEN }}:" \
              "$SONAR_HOST/api/qualitygates/list?organization=$SONAR_ORG" \
              | jq -r --arg n "$NAME" '.qualitygates[] | select(.name==$n) | .id')
          fi
          if [ -z "$GATE_ID" ]; then
            echo "::error::Could not create or find quality gate $NAME"
            exit 1
          fi
          echo "Using gate id $GATE_ID"
          echo "gate_id=$GATE_ID" >> "$GITHUB_OUTPUT"

      - name: Add conditions from gate.xml
        run: |
          GATE_ID="${{ steps.create.outputs.gate_id }}"
          FAILED=0
          while read -r METRIC OP ERROR; do
            [ -z "$METRIC" ] && continue
            echo "Adding condition: $METRIC $OP $ERROR"
            RESP=$(curl -s -u "${{ secrets.SONAR_ENT_TOKEN }}:" -X POST \
              "$SONAR_HOST/api/qualitygates/create_condition" \
              --data-urlencode "gateId=$GATE_ID" \
              --data-urlencode "organization=$SONAR_ORG" \
              --data-urlencode "metric=$METRIC" \
              --data-urlencode "op=$OP" \
              --data-urlencode "error=$ERROR")
            echo "$RESP"
            if echo "$RESP" | grep -q '"errors"'; then FAILED=1; fi
          done < <(xmlstarlet sel -t -m '/qualityGate/conditions/condition' -v '@metric' -o ' ' -v '@op' -o ' ' -v '@error' -n sonar/gate.xml)
          if [ "$FAILED" = "1" ]; then
            echo "::error::One or more conditions could not be added"
            exit 1
          fi

      - name: Associate project (demo.java) to gate
        run: |
          PROJECT=$(xmlstarlet sel -t -v '/qualityGate/project' sonar/gate.xml)
          RESP=$(curl -s -u "${{ secrets.SONAR_ENT_TOKEN }}:" -X POST \
            "$SONAR_HOST/api/qualitygates/select" \
            --data-urlencode "gateId=${{ steps.create.outputs.gate_id }}" \
            --data-urlencode "projectKey=$PROJECT" \
            --data-urlencode "organization=$SONAR_ORG")
          echo "$RESP"
          if echo "$RESP" | grep -q '"errors"'; then
            echo "::error::Failed to associate $PROJECT with the quality gate"
            exit 1
          fi
          echo "::notice::Project $PROJECT associated with quality gate ${{ steps.create.outputs.gate_id }}"
