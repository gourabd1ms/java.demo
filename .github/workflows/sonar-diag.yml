name: Sonar Diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Debug swaggerhub fetch
        run: |
          echo "--- attempt 1: swagger.json ---"
          curl -s -w "\nHTTP:%{http_code}\n" "https://api.swaggerhub.com/apis/SonarSource/PUBLIC-sonarcloud-organizations-enterprises-external/1.0.1/swagger.json"
          echo "--- attempt 2: no suffix ---"
          curl -s -w "\nHTTP:%{http_code}\n" "https://api.swaggerhub.com/apis/SonarSource/PUBLIC-sonarcloud-organizations-enterprises-external/1.0.1"
          echo "--- attempt 3: resolved (follow redirects) ---"
          curl -sL -w "\nHTTP:%{http_code}\n" "https://api.swaggerhub.com/apis/SonarSource/PUBLIC-sonarcloud-organizations-enterprises-external/1.0.1/swagger.json"
          echo "--- attempt 4: -v verbose on attempt 1 ---"
          curl -v "https://api.swaggerhub.com/apis/SonarSource/PUBLIC-sonarcloud-organizations-enterprises-external/1.0.1/swagger.json" 2>&1 | tail -30
