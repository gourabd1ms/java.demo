name: Sonar Diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: List all webservice paths
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $SONAR_TOKEN" "https://sonarqube.us/api/webservices/list?include_internals=true" -o /tmp/ws.json
          python3 -c "
          import json
          d = json.load(open('/tmp/ws.json'))
          for ws in sorted(d['webServices'], key=lambda w: w['path']):
              print(ws['path'])
          "
