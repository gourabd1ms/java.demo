name: Sonar Diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe v2 root and docs html
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "=== v2 root ==="
          curl -sL -w "\nHTTP:%{http_code}\n" -H "Authorization: Bearer $SONAR_TOKEN" "https://sonarqube.us/api/v2"
          echo "=== v2 root trailing slash ==="
          curl -sL -w "\nHTTP:%{http_code}\n" -H "Authorization: Bearer $SONAR_TOKEN" "https://sonarqube.us/api/v2/"
          echo "=== fetch landing page html ==="
          curl -sL "https://api-docs.sonarsource.com/sonarqube-cloud/default/landing" -o /tmp/landing.html
          wc -c /tmp/landing.html
          python3 -c "
          import re
          html = open('/tmp/landing.html', errors='ignore').read()
          urls = set(re.findall(r'[\"\'](https?://[^\"\']+\.(?:json|yaml|yml))[\"\']', html))
          for u in urls:
              print('SPEC_URL:', u)
          urls2 = set(re.findall(r'[\"\'](/[^\"\']*(?:openapi|spec)[^\"\']*)[\"\']', html, re.I))
          for u in urls2:
              print('REL_SPEC_PATH:', u)
          "
