name: Sonar Diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Try SwaggerHub spec fetch
        run: |
          for owner in sonarsource SonarSource sonarqube sonar-source; do
            echo "trying owner=$owner"
            curl -s -o /tmp/spec.json -w "HTTP:%{http_code}\n" "https://api.swaggerhub.com/apis/$owner/sonarqube-cloud/default"
            head -c 200 /tmp/spec.json
            echo
          done
          echo "=== swaggerhub search ==="
          curl -s -w "\nHTTP:%{http_code}\n" "https://api.swaggerhub.com/specs?query=sonarqube-cloud" | head -c 2000
          echo
          python3 -c "
          import json
          try:
              d = json.load(open('/tmp/spec.json'))
              paths = list(d.get('paths', {}).keys())
              print('TOTAL_PATHS:', len(paths))
              for p in paths:
                  if 'dop' in p.lower() or 'analysis' in p.lower() or 'bound' in p.lower() or 'automatic' in p.lower() or 'binding' in p.lower():
                      print('HIT:', p)
          except Exception as e:
              print('parse error', e)
          "
