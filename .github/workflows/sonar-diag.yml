          echo -n "sca: "; curl -s -o /tmp/r.json -w "HTTP %{http_code} " -H "Authorization: Bearer $SONAR_TOKEN" "https://sonarqube.us/api/v2/sca"; cat /tmp/r.json; echo
          echo -n "fix-suggestions: "; curl -s -o /tmp/r.json -w "HTTP %{http_code} " -H "Authorization: Bearer $SONAR_TOKEN" "https://sonarqube.us/api/v2/fix-suggestions"; cat /tmp/r.json; echo
          echo -n "notifications: "; curl -s -o /tmp/r.json -w "HTTP %{http_code} " -H "Authorization: Bearer $SONAR_TOKEN" "https://sonarqube.us/api/v2/notifications"; cat /tmp/r.json; echo
