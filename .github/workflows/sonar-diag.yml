name: Sonar Diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe portfolio endpoints
        env:
          ENT_TOKEN: ${{ secrets.SONAR_ENT_TOKEN }}
        run: |
          echo "=== https://api.sonarqube.us/enterprises/portfolios?portfolioId=326ad65b-8c6b-4353-9a9d-0e09705076c7 ==="
          curl -s -w "\nHTTP:%{http_code}\n" -H "accept: application/json" -H "Authorization: Bearer $ENT_TOKEN" "https://api.sonarqube.us/enterprises/portfolios?portfolioId=326ad65b-8c6b-4353-9a9d-0e09705076c7"
          echo "=== https://api.sonarqube.us/portfolios/portfolios?portfolioId=326ad65b-8c6b-4353-9a9d-0e09705076c7 ==="
          curl -s -w "\nHTTP:%{http_code}\n" -H "accept: application/json" -H "Authorization: Bearer $ENT_TOKEN" "https://api.sonarqube.us/portfolios/portfolios?portfolioId=326ad65b-8c6b-4353-9a9d-0e09705076c7"
          echo "=== https://api.sonarqube.us/enterprises/morganstanley/portfolios/326ad65b-8c6b-4353-9a9d-0e09705076c7 ==="
          curl -s -w "\nHTTP:%{http_code}\n" -H "accept: application/json" -H "Authorization: Bearer $ENT_TOKEN" "https://api.sonarqube.us/enterprises/morganstanley/portfolios/326ad65b-8c6b-4353-9a9d-0e09705076c7"
          echo "=== https://api.sonarqube.us/portfolios/326ad65b-8c6b-4353-9a9d-0e09705076c7 ==="
          curl -s -w "\nHTTP:%{http_code}\n" -H "accept: application/json" -H "Authorization: Bearer $ENT_TOKEN" "https://api.sonarqube.us/portfolios/326ad65b-8c6b-4353-9a9d-0e09705076c7"
          echo "=== https://sonarqube.us/api/views/show?key=326ad65b-8c6b-4353-9a9d-0e09705076c7 ==="
          curl -s -w "\nHTTP:%{http_code}\n" -H "accept: application/json" -H "Authorization: Bearer $ENT_TOKEN" "https://sonarqube.us/api/views/show?key=326ad65b-8c6b-4353-9a9d-0e09705076c7"
