name: Sonar Diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe swaggerhub spec by exact name
        run: |
          echo "trying https://api.swaggerhub.com/apis/sonarsource/public-sonarcloud-organizations-enterprises-external/1.0.1"
          curl -s -o /tmp/spec.json -w "HTTP:%{http_code}\n" "https://api.swaggerhub.com/apis/sonarsource/public-sonarcloud-organizations-enterprises-external/1.0.1"
          head -c 300 /tmp/spec.json; echo
          echo "trying https://api.swaggerhub.com/apis/SonarSource/public-sonarcloud-organizations-enterprises-external/1.0.1"
          curl -s -o /tmp/spec.json -w "HTTP:%{http_code}\n" "https://api.swaggerhub.com/apis/SonarSource/public-sonarcloud-organizations-enterprises-external/1.0.1"
          head -c 300 /tmp/spec.json; echo
          echo "trying https://api.swaggerhub.com/apis/sonarqube/public-sonarcloud-organizations-enterprises-external/1.0.1"
          curl -s -o /tmp/spec.json -w "HTTP:%{http_code}\n" "https://api.swaggerhub.com/apis/sonarqube/public-sonarcloud-organizations-enterprises-external/1.0.1"
          head -c 300 /tmp/spec.json; echo
          echo "trying https://api.swaggerhub.com/apis/sonar-source/public-sonarcloud-organizations-enterprises-external/1.0.1"
          curl -s -o /tmp/spec.json -w "HTTP:%{http_code}\n" "https://api.swaggerhub.com/apis/sonar-source/public-sonarcloud-organizations-enterprises-external/1.0.1"
          head -c 300 /tmp/spec.json; echo
          echo "trying https://api.swaggerhub.com/apis/sonarcloud/public-sonarcloud-organizations-enterprises-external/1.0.1"
          curl -s -o /tmp/spec.json -w "HTTP:%{http_code}\n" "https://api.swaggerhub.com/apis/sonarcloud/public-sonarcloud-organizations-enterprises-external/1.0.1"
          head -c 300 /tmp/spec.json; echo
          echo "=== fetch the actual docs page for embedded spec refs ==="
          curl -sL "https://api-docs.sonarsource.com/sonarqube-cloud/default/public-sonarcloud-organizations-enterprises-external-1-0-1" -o /tmp/page.html
          wc -c /tmp/page.html
          grep -o "https://api.swaggerhub.com/apis[^\"]*" /tmp/page.html | sort -u || true
          grep -o "apis/[a-zA-Z0-9_.-]*/[a-zA-Z0-9_.-]*/[0-9.]*" /tmp/page.html | sort -u || true
