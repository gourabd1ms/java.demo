name: Sonar Diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Try common spec-download suffixes on the docs page itself
        run: |
          BASE="https://api-docs.sonarsource.com/sonarqube-cloud/default/public-sonarcloud-organizations-enterprises-external-1-0-1"
          for suffix in ".json" "/openapi.json" "/swagger.json" "?format=json" "/download"; do
            echo "--- $BASE$suffix ---"
            curl -sL -w "\nHTTP:%{http_code}\n" "$BASE$suffix" | head -c 300
            echo
          done
