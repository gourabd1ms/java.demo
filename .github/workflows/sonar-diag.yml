name: Sonar Diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Broader search
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $SONAR_TOKEN" "https://sonarqube.us/api/webservices/list?include_internals=true" -o /tmp/ws.json
          python3 -c "
          import json
          d = json.load(open('/tmp/ws.json'))
          raw = json.dumps(d).lower()
          print('AUTOMATIC_MENTIONS:', raw.count('automatic'))
          for ws in d['webServices']:
              if ws['path'] in ('api/alm_settings', 'api/devops_platform', 'api/project_analyses', 'api/projects', 'api/new_code_periods', 'api/ci'):
                  print('=== ' + ws['path'] + ' ===')
                  for a in ws['actions']:
                      print(' ', a['key'])
          for ws in d['webServices']:
              for a in ws['actions']:
                  if 'automatic' in json.dumps(a).lower():
                      print('MATCH:', ws['path'] + '/' + a['key'])
          "
