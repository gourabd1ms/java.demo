name: Sonar Diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe portfolio endpoints v2
        env:
          ENT_TOKEN: ${{ secrets.SONAR_ENT_TOKEN }}
        run: |
          echo "=== https://api.sonarqube.us/enterprises/portfolios?portfolioId=326ad65b-8c6b-4353-9a9d-0e09705076c7&enterpriseKey=morganstanley ==="
          curl -s -w "\nHTTP:%{http_code}\n" -H "accept: application/json" -H "Authorization: Bearer $ENT_TOKEN" "https://api.sonarqube.us/enterprises/portfolios?portfolioId=326ad65b-8c6b-4353-9a9d-0e09705076c7&enterpriseKey=morganstanley"
          echo "=== https://api.sonarqube.us/enterprises/portfolios?portfolioId=326ad65b-8c6b-4353-9a9d-0e09705076c7&favorite=true ==="
          curl -s -w "\nHTTP:%{http_code}\n" -H "accept: application/json" -H "Authorization: Bearer $ENT_TOKEN" "https://api.sonarqube.us/enterprises/portfolios?portfolioId=326ad65b-8c6b-4353-9a9d-0e09705076c7&favorite=true"
          echo "=== https://api.sonarqube.us/enterprises/portfolios/326ad65b-8c6b-4353-9a9d-0e09705076c7 ==="
          curl -s -w "\nHTTP:%{http_code}\n" -H "accept: application/json" -H "Authorization: Bearer $ENT_TOKEN" "https://api.sonarqube.us/enterprises/portfolios/326ad65b-8c6b-4353-9a9d-0e09705076c7"
          echo "=== https://api.sonarqube.us/enterprises/enterprises?enterpriseKey=morganstanley ==="
          curl -s -w "\nHTTP:%{http_code}\n" -H "accept: application/json" -H "Authorization: Bearer $ENT_TOKEN" "https://api.sonarqube.us/enterprises/enterprises?enterpriseKey=morganstanley"
