name: Sonar Diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe v2 candidate groups
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "=== probing candidate v2 groups ==="
          echo -n "dop-translation: "; curl -s -o /tmp/r.json -w "HTTP %{http_code} " -H "Authorization: Bearer $SONAR_TOKEN" "https://sonarqube.us/api/v2/dop-translation"; cat /tmp/r.json; echo
          echo -n "devops-platform: "; curl -s -o /tmp/r.json -w "HTTP %{http_code} " -H "Authorization: Bearer $SONAR_TOKEN" "https://sonarqube.us/api/v2/devops-platform"; cat /tmp/r.json; echo
          echo -n "devops-platforms: "; curl -s -o /tmp/r.json -w "HTTP %{http_code} " -H "Authorization: Bearer $SONAR_TOKEN" "https://sonarqube.us/api/v2/devops-platforms"; cat /tmp/r.json; echo
          echo -n "github-integration: "; curl -s -o /tmp/r.json -w "HTTP %{http_code} " -H "Authorization: Bearer $SONAR_TOKEN" "https://sonarqube.us/api/v2/github-integration"; cat /tmp/r.json; echo
          echo -n "project-bindings: "; curl -s -o /tmp/r.json -w "HTTP %{http_code} " -H "Authorization: Bearer $SONAR_TOKEN" "https://sonarqube.us/api/v2/project-bindings"; cat /tmp/r.json; echo
          echo -n "project-management: "; curl -s -o /tmp/r.json -w "HTTP %{http_code} " -H "Authorization: Bearer $SONAR_TOKEN" "https://sonarqube.us/api/v2/project-management"; cat /tmp/r.json; echo
          echo -n "projects-management: "; curl -s -o /tmp/r.json -w "HTTP %{http_code} " -H "Authorization: Bearer $SONAR_TOKEN" "https://sonarqube.us/api/v2/projects-management"; cat /tmp/r.json; echo
          echo -n "analysis: "; curl -s -o /tmp/r.json -w "HTTP %{http_code} " -H "Authorization: Bearer $SONAR_TOKEN" "https://sonarqube.us/api/v2/analysis"; cat /tmp/r.json; echo
          echo -n "clean-code-policy: "; curl -s -o /tmp/r.json -w "HTTP %{http_code} " -H "Authorization: Bearer $SONAR_TOKEN" "https://sonarqube.us/api/v2/clean-code-policy"; cat /tmp/r.json; echo
          echo -n "authorizations: "; curl -s -o /tmp/r.json -w "HTTP %{http_code} " -H "Authorization: Bearer $SONAR_TOKEN" "https://sonarqube.us/api/v2/authorizations"; cat /tmp/r.json; echo
