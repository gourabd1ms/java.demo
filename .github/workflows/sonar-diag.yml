          echo -n "mode: "; curl -s -o /tmp/r.json -w "HTTP %{http_code} " -H "Authorization: Bearer $SONAR_TOKEN" "https://sonarqube.us/api/v2/mode"; cat /tmp/r.json; echo
          echo -n "project-analyses: "; curl -s -o /tmp/r.json -w "HTTP %{http_code} " -H "Authorization: Bearer $SONAR_TOKEN" "https://sonarqube.us/api/v2/project-analyses"; cat /tmp/r.json; echo
          echo -n "ai-codefix: "; curl -s -o /tmp/r.json -w "HTTP %{http_code} " -H "Authorization: Bearer $SONAR_TOKEN" "https://sonarqube.us/api/v2/ai-codefix"; cat /tmp/r.json; echo
