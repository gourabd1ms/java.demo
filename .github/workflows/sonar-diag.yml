name: Sonar Diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Extract spec references from docs page
        run: |
          curl -sL "https://api-docs.sonarsource.com/sonarqube-cloud/default/landing" -o /tmp/landing.html
          wc -c /tmp/landing.html
          python3 -c "
          import re
          html = open('/tmp/landing.html', errors='ignore').read()
          for m in re.finditer(r'apiDescriptionUrl[=:]\s*[\"\']([^\"\']+)[\"\']', html, re.I):
              print('API_DESC_URL:', m.group(1))
          for m in re.finditer(r'[\"\']([^\"\']*\.(?:json|yaml|yml))[\"\']', html, re.I):
              print('JSON_YAML_REF:', m.group(1))
          for m in re.finditer(r'src=[\"\']([^\"\']+)[\"\']', html, re.I):
              print('SCRIPT_SRC:', m.group(1))
          "
