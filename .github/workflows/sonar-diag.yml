name: Sonar Diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and parse the real portfolios spec
        run: |
          curl -s -o /tmp/spec.json -w "HTTP:%{http_code}\n" "https://api.swaggerhub.com/apis/SonarSource/PUBLIC-sonarcloud-organizations-enterprises-external/1.0.1/swagger.json"
          wc -c /tmp/spec.json
          python3 -c "
          import json
          d = json.load(open('/tmp/spec.json'))
          for path, methods in d.get('paths', {}).items():
              if 'portfolio' in path.lower():
                  for verb, op in methods.items():
                      print('=====', verb.upper(), path, '=====')
                      print('summary:', op.get('summary'))
                      print('operationId:', op.get('operationId'))
                      params = op.get('parameters', [])
                      for p in params:
                          print('  param:', p.get('name'), p.get('in'), 'required=' + str(p.get('required')))
                      rb = op.get('requestBody')
                      if rb:
                          try:
                              schema = rb['content']['application/json']['schema']
                              print('  requestBody schema:', json.dumps(schema)[:1500])
                          except Exception as e:
                              print('  requestBody parse error', e)
          "
