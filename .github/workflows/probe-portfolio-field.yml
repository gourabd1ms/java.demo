# Throwaway diagnostic workflow (round 8) - read-only. Compare the real
# working portfolio (454cbe22, created via the actual UI and confirmed to
# have real project selections) against our failing throwaway ones, to
# find what field differs.
name: Probe Compare Working Portfolio
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SONAR_ENT_TOKEN: ${{ secrets.SONAR_ENT_TOKEN }}
      BASE: https://api.sonarqube.us
      WORKING_PORTFOLIO_ID: 454cbe22-e85b-4107-886e-17259da87ece
      BROKEN_PORTFOLIO_ID: 0e8e7a7e-34ad-40b1-aca0-9a83b330721e
    steps:
      - name: "A. GET the real working portfolio (454cbe22)"
        run: |
          curl -s -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" "$BASE/enterprises/portfolios/$WORKING_PORTFOLIO_ID" | jq .

      - name: "B. GET our broken throwaway portfolio (0e8e7a7e)"
        run: |
          curl -s -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" "$BASE/enterprises/portfolios/$BROKEN_PORTFOLIO_ID" | jq .
