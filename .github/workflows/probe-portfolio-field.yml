# Throwaway diagnostic workflow (round 16). Safe to delete afterward.
# Untested combo: organizationIds committed via its OWN ?simulate=false
# PATCH first (and verified persisted via GET), THEN a separate
# ?simulate=false PATCH sets projects - mirroring the wizard's step-by-
# step flow, rather than combining both fields in one call (round 12,
# which failed) or setting projects with organizationIds still empty
# (round 11, which "succeeded" but resolved to 5 unrelated projects -
# consistent with organizationIds being unset/empty at match time).
name: Probe Sequential Org Then Projects Round 16
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SONAR_ENT_TOKEN: ${{ secrets.SONAR_ENT_TOKEN }}
      BASE: https://api.sonarqube.us
      ENTERPRISE_ID: 896d0782-65b7-4d6f-ac7c-29d00e2ec684
      ORG_ID: 705a240f-23f9-4524-86cf-f50f6ccac3a8
      C_DEMO_UUID: 7c533ad0-f769-4e2b-a552-01f110de067c
      CPP_DEMO_UUID: 536b2816-d7ff-493f-9546-e204769fc822
      JAVA_DEMO_UUID: 6aefd5a1-006c-4425-91ab-bc4a22a509e8
    steps:
      - name: "0. Create a fresh throwaway test portfolio"
        id: portfolio
        run: |
          RESP=$(curl -s -w "\nHTTP:%{http_code}" -X POST \
            -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" -H "Content-Type: application/json" \
            -d "{\"enterpriseId\":\"$ENTERPRISE_ID\",\"name\":\"zzz-probe16-cleanup-me\",\"description\":\"safe to delete\",\"selection\":\"projects\"}" \
            "$BASE/enterprises/portfolios")
          echo "$RESP"
          PID=$(echo "${RESP%$'\n'HTTP:*}" | jq -r '.id')
          echo "portfolio id: $PID"
          echo "id=$PID" >> "$GITHUB_OUTPUT"

      - name: "1. PATCH ?simulate=false with ONLY organizationIds"
        run: |
          PID="${{ steps.portfolio.outputs.id }}"
          echo "=== step 1: PATCH ?simulate=false {organizationIds} ==="
          curl -s -w "\nHTTP:%{http_code}\n" -X PATCH \
            -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" -H "Content-Type: application/json" \
            -d "{\"organizationIds\":[\"$ORG_ID\"]}" \
            "$BASE/enterprises/portfolios/$PID?simulate=false"

      - name: "2. Verify organizationIds actually persisted"
        run: |
          PID="${{ steps.portfolio.outputs.id }}"
          curl -s -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" "$BASE/enterprises/portfolios/$PID" | jq .

      - name: "3. PATCH ?simulate=false with ONLY projects (org already committed)"
        run: |
          PID="${{ steps.portfolio.outputs.id }}"
          echo "=== step 3: PATCH ?simulate=false {projects:[{branchId}]} ==="
          curl -s -w "\nHTTP:%{http_code}\n" -X PATCH \
            -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" -H "Content-Type: application/json" \
            -d "{\"projects\":[{\"branchId\":\"$C_DEMO_UUID\"},{\"branchId\":\"$CPP_DEMO_UUID\"},{\"branchId\":\"$JAVA_DEMO_UUID\"}]}" \
            "$BASE/enterprises/portfolios/$PID?simulate=false"

      - name: "4. Final verify via GET /enterprises/portfolios/{id}"
        run: |
          PID="${{ steps.portfolio.outputs.id }}"
          curl -s -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" "$BASE/enterprises/portfolios/$PID" | jq .

      - name: "5. Final verify via GET /enterprises/portfolio-projects (real read model, names included)"
        run: |
          PID="${{ steps.portfolio.outputs.id }}"
          curl -s -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" \
            "$BASE/enterprises/portfolio-projects?portfolioId=$PID&organizationId=$ORG_ID&q=&pageIndex=1" | jq '[.projects[] | select(.isSelected==true) | {projectKey, name, id}]'
