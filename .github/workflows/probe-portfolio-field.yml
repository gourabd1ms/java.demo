name: Probe Portfolio List Endpoint
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SONAR_ENT_TOKEN: ${{ secrets.SONAR_ENT_TOKEN }}
      BASE: https://api.sonarqube.us
      ENTERPRISE_ID: 896d0782-65b7-4d6f-ac7c-29d00e2ec684
      ORG_ID: 705a240f-23f9-4524-86cf-f50f6ccac3a8
    steps:
      - name: A. GET bare /enterprises/portfolios
        run: |
          echo "=== GET /enterprises/portfolios ==="
          curl -s -w "\nHTTP:%{http_code}\n" -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" "$BASE/enterprises/portfolios"
      - name: B. GET /enterprises/portfolios?enterpriseId=
        run: |
          echo "=== GET /enterprises/portfolios?enterpriseId= ==="
          curl -s -w "\nHTTP:%{http_code}\n" -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" "$BASE/enterprises/portfolios?enterpriseId=$ENTERPRISE_ID"
      - name: C. GET /enterprises/portfolios?organizationId=
        run: |
          echo "=== GET /enterprises/portfolios?organizationId= ==="
          curl -s -w "\nHTTP:%{http_code}\n" -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" "$BASE/enterprises/portfolios?organizationId=$ORG_ID"
      - name: D. DELETE dry check on a known throwaway portfolio (524f1969, orphan parent, empty)
        run: |
          echo "=== DELETE /enterprises/portfolios/524f1969-c942-4fb3-bdfe-43a4ba35d06b ==="
          curl -s -w "\nHTTP:%{http_code}\n" -X DELETE -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" "$BASE/enterprises/portfolios/524f1969-c942-4fb3-bdfe-43a4ba35d06b"
      - name: E. Re-GET that portfolio to confirm delete worked
        run: |
          curl -s -w "\nHTTP:%{http_code}\n" -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" "$BASE/enterprises/portfolios/524f1969-c942-4fb3-bdfe-43a4ba35d06b"
