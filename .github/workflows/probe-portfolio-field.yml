# Throwaway diagnostic workflow - probes PortfolioProjectRequest field names
# by sending a deliberately wrong-typed value for each candidate field name.
# Jackson silently ignores *unknown* fields (confirmed - see sonar-diag.yml
# and sonar-create-portfolio-hierarchy.yml history) but throws a type-mismatch
# error naming the field if it IS a real field on the DTO. So: whichever
# candidate's response error mentions that same field name is the real one.
# Safe to delete once the real field name is found.
name: Probe Portfolio Project Field
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SONAR_ENT_TOKEN: ${{ secrets.SONAR_ENT_TOKEN }}
      BASE: https://api.sonarqube.us
      TARGET_PORTFOLIO: afdd07ac-c27c-4531-984a-2ebadead6101
    steps:
      - name: Probe candidate field names
        run: |
          for FIELD in key project projectKey id componentKey component projectId name projectUuid uuid projectID projectid; do
            echo "=== candidate field: $FIELD ==="
            curl -s -w "\nHTTP:%{http_code}\n" -X PATCH \
              -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" -H "Content-Type: application/json" \
              -d "{\"projects\":[{\"$FIELD\":{\"nested\":1}}]}" \
              "$BASE/enterprises/portfolios/$TARGET_PORTFOLIO"
          done
