# Throwaway diagnostic workflow (round 13). Safe to delete afterward.
# Minimal isolation test: ONE project, brand-new portfolio, simulate=false,
# nothing else in the body. See exactly what gets stored for a known input
# branchId (c.demo's UUID from the real portfolio-projects read model).
name: Probe Minimal Single Project Round 13
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SONAR_ENT_TOKEN: ${{ secrets.SONAR_ENT_TOKEN }}
      BASE: https://api.sonarqube.us
      ENTERPRISE_ID: 896d0782-65b7-4d6f-ac7c-29d00e2ec684
      ORG_ID: 705a240f-23f9-4524-86cf-f50f6ccac3a8
      C_DEMO_UUID: 7c533ad0-f769-4e2b-a552-01f110de067c
    steps:
      - name: "0. Create a fresh throwaway test portfolio"
        id: portfolio
        run: |
          RESP=$(curl -s -w "\nHTTP:%{http_code}" -X POST \
            -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" -H "Content-Type: application/json" \
            -d "{\"enterpriseId\":\"$ENTERPRISE_ID\",\"name\":\"zzz-probe13-cleanup-me\",\"description\":\"safe to delete\",\"selection\":\"projects\"}" \
            "$BASE/enterprises/portfolios")
          echo "$RESP"
          PID=$(echo "${RESP%$'\n'HTTP:*}" | jq -r '.id')
          echo "portfolio id: $PID"
          echo "id=$PID" >> "$GITHUB_OUTPUT"

      - name: "1. PATCH ?simulate=false with exactly ONE project, nothing else"
        run: |
          PID="${{ steps.portfolio.outputs.id }}"
          echo "=== PATCH ?simulate=false, single project, c.demo UUID: $C_DEMO_UUID ==="
          curl -s -w "\nHTTP:%{http_code}\n" -X PATCH \
            -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" -H "Content-Type: application/json" \
            -d "{\"projects\":[{\"branchId\":\"$C_DEMO_UUID\"}]}" \
            "$BASE/enterprises/portfolios/$PID?simulate=false"

      - name: "2. Verify via GET /enterprises/portfolios/{id}"
        run: |
          PID="${{ steps.portfolio.outputs.id }}"
          curl -s -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" "$BASE/enterprises/portfolios/$PID" | jq .

      - name: "3. Verify via GET /enterprises/portfolio-projects (real read model, names included)"
        run: |
          PID="${{ steps.portfolio.outputs.id }}"
          curl -s -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" \
            "$BASE/enterprises/portfolio-projects?portfolioId=$PID&organizationId=$ORG_ID&q=&pageIndex=1" | jq '[.projects[] | select(.isSelected==true) | {projectKey, name, id}]'
