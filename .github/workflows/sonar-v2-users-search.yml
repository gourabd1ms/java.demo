name: Sonar v2 - Users API - Search

# searchUsers.
#
# Primary surface (v2):
#   GET {api_base}/users-management/users
#     ?q&email&organizationIds&active&managed&externalIdentity&groupId
#     &pageIndex&pageSize
#
# MEASURED on this tenant (run 34922690963, sonar-v2-users-discover.yml):
# every https://sonarqube.us/api/v2/* path answers 404 - SonarQube Cloud US
# exposes no v2 users surface, and https://api.sonarqube.us is an AWS API
# Gateway that wants SigV4, not a Sonar token. So this workflow tries v2
# first and, on 404, falls back to the v1 endpoint that does work here:
#   GET /api/organizations/search_members?organization=<key>&q&p&ps
# Set fallback_v1=false to assert v2 only and fail loudly instead.
#
# Read-only.

on:
  workflow_dispatch:
    inputs:
      q:
        description: "Free-text filter on login / name / email"
        required: false
        type: string
        default: ""
      org_key:
        description: "Organization key"
        required: false
        type: string
        default: "gourabd1ms"
      fallback_v1:
        description: "Fall back to the v1 endpoint when v2 returns 404"
        required: false
        type: boolean
        default: true
      api_base:
        description: "v2 API base URL"
        required: false
        type: string
        default: "https://sonarqube.us/api/v2"
      users_path:
        description: "v2 users collection path under the base"
        required: false
        type: string
        default: "/users-management/users"
      email:
        description: "Exact email filter (v2 only)"
        required: false
        type: string
        default: ""
      organization_id:
        description: "Organization UUID (v2 only; leave empty to auto-resolve)"
        required: false
        type: string
        default: ""
      active:
        description: "Filter by active state (v2 only)"
        required: false
        type: choice
        options: [ "", "true", "false" ]
        default: ""
      managed:
        description: "Filter by IdP-managed state (v2 only)"
        required: false
        type: choice
        options: [ "", "true", "false" ]
        default: ""
      external_identity:
        description: "External / IdP identity filter (v2 only)"
        required: false
        type: string
        default: ""
      group_id:
        description: "Restrict to members of this group UUID (v2 only)"
        required: false
        type: string
        default: ""
      page_index:
        description: "Page index (1-based)"
        required: false
        type: string
        default: "1"
      page_size:
        description: "Page size"
        required: false
        type: string
        default: "50"

jobs:
  search:
    runs-on: ubuntu-latest
    env:
      SONAR_ENT_TOKEN: ${{ secrets.SONAR_ENT_TOKEN }}
      SONARQUBE_API_TOKEN: ${{ secrets.SONARQUBE_API_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      API_BASE: ${{ inputs.api_base }}
      USERS_PATH: ${{ inputs.users_path }}
      FALLBACK_V1: ${{ inputs.fallback_v1 }}
      Q: ${{ inputs.q }}
      EMAIL: ${{ inputs.email }}
      ORG_ID: ${{ inputs.organization_id }}
      ORG_KEY: ${{ inputs.org_key }}
      ACTIVE: ${{ inputs.active }}
      MANAGED: ${{ inputs.managed }}
      EXTERNAL_IDENTITY: ${{ inputs.external_identity }}
      GROUP_ID: ${{ inputs.group_id }}
      PAGE_INDEX: ${{ inputs.page_index }}
      PAGE_SIZE: ${{ inputs.page_size }}
      WEB_HOST: https://sonarqube.us
    steps:
      - name: Resolve token
        run: |
          set +e
          set -uo pipefail
          TOKEN="${SONAR_ENT_TOKEN:-}"
          if [ -z "$TOKEN" ]; then TOKEN="${SONARQUBE_API_TOKEN:-}"; fi
          if [ -z "$TOKEN" ]; then TOKEN="${SONAR_TOKEN:-}"; fi
          if [ -z "$TOKEN" ]; then
            echo "::error::No Sonar token found. Set repo secret SONAR_ENT_TOKEN (or SONARQUBE_API_TOKEN / SONAR_TOKEN)."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Search users
        run: |
          set +e
          set -uo pipefail

          # --- v2 attempt -------------------------------------------------
          if [ -z "$ORG_ID" ]; then
            curl -sS -u "$TOKEN:" "$WEB_HOST/api/organizations/search?member=true" -o orgs.json
            ORG_ID=$(jq -r --arg k "$ORG_KEY" '.organizations[]? | select(.key==$k) | .id // empty' orgs.json 2>/dev/null | head -1)
            echo "Organization UUID for '$ORG_KEY': ${ORG_ID:-<none exposed by v1>}"
          fi

          QS=$(ORG_ID="$ORG_ID" python3 - <<'PY'
          import os, urllib.parse
          pairs = [("q", os.environ.get("Q", "")),
                   ("email", os.environ.get("EMAIL", "")),
                   ("organizationIds", os.environ.get("ORG_ID", "")),
                   ("active", os.environ.get("ACTIVE", "")),
                   ("managed", os.environ.get("MANAGED", "")),
                   ("externalIdentity", os.environ.get("EXTERNAL_IDENTITY", "")),
                   ("groupId", os.environ.get("GROUP_ID", "")),
                   ("pageIndex", os.environ.get("PAGE_INDEX", "1")),
                   ("pageSize", os.environ.get("PAGE_SIZE", "50"))]
          print(urllib.parse.urlencode([(k, v) for k, v in pairs if v != ""]))
          PY
          )
          V2_URL="${API_BASE}${USERS_PATH}?${QS}"
          echo "---- GET $V2_URL ----"
          CODE=$(curl -sS -o v2.json -w '%{http_code}' --max-time 60 \
                   -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" "$V2_URL")
          echo "HTTP $CODE"
          if [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
            echo "Bearer rejected; retrying with HTTP basic (token as username)."
            CODE=$(curl -sS -o v2.json -w '%{http_code}' --max-time 60 \
                     -u "$TOKEN:" -H "Accept: application/json" "$V2_URL")
            echo "HTTP $CODE"
          fi
          head -c 400 v2.json; echo

          SURFACE=v2
          if [ "$CODE" != "200" ]; then
            if [ "$FALLBACK_V1" != "true" ]; then
              echo "::error::v2 searchUsers returned HTTP $CODE and fallback_v1 is off."
              exit 1
            fi
            # --- v1 fallback ----------------------------------------------
            echo
            echo "v2 returned HTTP $CODE - falling back to v1 organizations/search_members."
            V1_URL="$WEB_HOST/api/organizations/search_members?organization=${ORG_KEY}&p=${PAGE_INDEX}&ps=${PAGE_SIZE}"
            if [ -n "$Q" ]; then V1_URL="${V1_URL}&q=${Q}"; fi
            echo "---- GET $V1_URL ----"
            CODE=$(curl -sS -o v1.json -w '%{http_code}' --max-time 60 -u "$TOKEN:" "$V1_URL")
            echo "HTTP $CODE"
            if [ "$CODE" != "200" ]; then
              echo "::error::v1 search_members also failed with HTTP $CODE."
              cat v1.json
              exit 1
            fi
            SURFACE=v1
            cp v1.json users.json
          else
            cp v2.json users.json
          fi

          echo "SURFACE=$SURFACE" >> "$GITHUB_ENV"
          echo
          echo "=== Users (surface: $SURFACE) ==="
          jq -r '(.users // .items // []) [] |
                 "\(.id // .uuid // "-")\t\(.login // "-")\t\(.name // "-")\t\(.email // "-")\tactive=\(.active // "-")\tmanaged=\(.managed // "-")\torgAdmin=\(.isOrgAdmin // "-")"' \
            users.json || cat users.json
          echo
          echo "total: $(jq -r '.page.total // .paging.total // .total // "?"' users.json)"

          {
            echo "### searchUsers (surface: \`$SURFACE\`)"
            echo
            if [ "$SURFACE" = "v2" ]; then
              echo "\`GET ${API_BASE}${USERS_PATH}\`"
            else
              echo "v2 unavailable on this tenant - used \`GET /api/organizations/search_members?organization=$ORG_KEY\`"
            fi
            echo
            echo "| id | login | name | email | active | managed | orgAdmin |"
            echo "|---|---|---|---|---|---|---|"
            jq -r '(.users // .items // []) [] |
                   "| \(.id // .uuid // "-") | \(.login // "-") | \(.name // "-") | \(.email // "-") | \(.active // "-") | \(.managed // "-") | \(.isOrgAdmin // "-") |"' \
              users.json 2>/dev/null || echo "| (could not parse response) | | | | | | |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-v2-users-search
          path: |
            users.json
            v1.json
            v2.json
            orgs.json
          if-no-files-found: ignore
