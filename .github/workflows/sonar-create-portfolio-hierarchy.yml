# ============================================================================
# Sonar: create a parent portfolio + 2 child sub-portfolios, split demo
# projects across the two children.
#
# This talks to Sonar's newer Enterprise REST API (host: api.sonarqube.us,
# everything hangs off /enterprises/...), NOT the classic on-prem
# `api/views/*` Web API. That API is still being reverse-engineered (see
# sonar-diag.yml) - confirmed behavior so far:
#   - GET  /enterprises/enterprises/{id}                  -> 200
#   - GET  /enterprises/portfolios/{id}                   -> 200
#   - POST /enterprises/portfolios                        -> 200, creates a
#           root-level portfolio (enterpriseId, name, description, selection)
#   - POST /enterprises/portfolios with "parentPortfolioId" in the body
#           -> 404 {"message":"Portfolio Hierarchy is not yet implemented."}
#           i.e. nesting a child AT CREATE TIME is explicitly unsupported.
#   - Bare collection endpoints (`/enterprises`, `/enterprises/organizations`,
#     `/enterprises/projects`) are blocked by a gateway in front of the API
#     and return HTTP 403 regardless of token validity.
#   - Classic project listing works from the sonarqube.us host instead:
#     GET https://sonarqube.us/api/components/search_projects?organization=...
#
# Since "Portfolio Hierarchy" is not implemented via create, step 4 below
# tests the one remaining plausible mechanism: the portfolio schema already
# exposes an (empty) "children" array on GET, so we try PATCHing that array
# onto the PARENT (rather than setting parentPortfolioId on the child) to
# see if that's how nesting is actually wired up. If neither this nor the
# create-time attempt works, this workflow still produces 3 independent
# portfolios (parent, child1, child2) with projects split across child1/
# child2 - real nesting would then need to be done by hand in the Sonar UI,
# or wait for Sonar to ship the feature.
#
# Step 6 (project assignment) similarly tries multiple candidate PATCH
# payload shapes and reports which one actually raised projectCount above 0,
# since that field name isn't documented either.
# ============================================================================
name: Sonar Create Portfolio Hierarchy

on:
  workflow_dispatch:

jobs:
  create-portfolio-hierarchy:
    runs-on: ubuntu-latest
    env:
      SONAR_ENT_TOKEN: ${{ secrets.SONAR_ENT_TOKEN }}
      BASE: https://api.sonarqube.us
      ENTERPRISE_ID: 896d0782-65b7-4d6f-ac7c-29d00e2ec684
      ORG_ID: 705a240f-23f9-4524-86cf-f50f6ccac3a8
      ORG_KEY: gourabd1ms
    steps:

      # ----------------------------------------------------------------
      # 1. Discover demo project keys in the org via the classic
      #    project-listing endpoint on the sonarqube.us host (confirmed
      #    working - the Enterprise API's own project-listing endpoints
      #    are blocked, see header comment).
      # ----------------------------------------------------------------
      - name: "1. Discover demo project keys"
        id: discover
        run: |
          set +e
          echo "--- GET sonarqube.us/api/components/search_projects ---"
          RESP=$(curl -s -w "\nHTTP:%{http_code}" -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" \
            "https://sonarqube.us/api/components/search_projects?organization=$ORG_KEY&ps=500")
          echo "$RESP"
          KEYS=$(echo "${RESP%$'\n'HTTP:*}" | jq -r '.components[]?.key' 2>/dev/null)

          # Last-resort fallback in case discovery ever breaks. EDIT this
          # list if you know the real demo project keys and discovery fails.
          if [ -z "$KEYS" ]; then
            echo "::warning::Could not discover project keys - falling back to a hardcoded single demo project."
            KEYS="gourabd1ms_java.demo"
          fi

          echo "Discovered project keys:"
          echo "$KEYS"

          JSON_KEYS=$(printf '%s\n' "$KEYS" | jq -R . | jq -s -c .)
          echo "project_keys=$JSON_KEYS" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------
      # 2. Create the parent portfolio ("parent").
      # ----------------------------------------------------------------
      - name: "2. Create parent portfolio"
        id: parent
        run: |
          echo "--- POST /enterprises/portfolios (parent) ---"
          RESP=$(curl -s -w "\nHTTP:%{http_code}" -X POST \
            -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" -H "Content-Type: application/json" \
            -d "{\"enterpriseId\":\"$ENTERPRISE_ID\",\"name\":\"parent\",\"description\":\"Parent portfolio - auto-created by GitHub Action\",\"selection\":\"projects\"}" \
            "$BASE/enterprises/portfolios")
          echo "$RESP"
          PARENT_ID=$(echo "${RESP%$'\n'HTTP:*}" | jq -r '.id')
          echo "Parent portfolio id: $PARENT_ID"
          echo "id=$PARENT_ID" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------
      # 3. Create child1 and child2 as their own portfolios. NOTE: we do
      #    NOT pass parentPortfolioId here - the API rejects that at
      #    create time with "Portfolio Hierarchy is not yet implemented"
      #    (confirmed by direct testing). Nesting is attempted separately
      #    in step 4.
      # ----------------------------------------------------------------
      - name: "3. Create child1 and child2 portfolios"
        id: children
        run: |
          echo "--- POST /enterprises/portfolios (child1) ---"
          RESP1=$(curl -s -w "\nHTTP:%{http_code}" -X POST \
            -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" -H "Content-Type: application/json" \
            -d "{\"enterpriseId\":\"$ENTERPRISE_ID\",\"name\":\"child1\",\"description\":\"Child portfolio 1 - auto-created by GitHub Action\",\"selection\":\"projects\"}" \
            "$BASE/enterprises/portfolios")
          echo "$RESP1"
          CHILD1_ID=$(echo "${RESP1%$'\n'HTTP:*}" | jq -r '.id')
          echo "child1 id: $CHILD1_ID"

          echo "--- POST /enterprises/portfolios (child2) ---"
          RESP2=$(curl -s -w "\nHTTP:%{http_code}" -X POST \
            -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" -H "Content-Type: application/json" \
            -d "{\"enterpriseId\":\"$ENTERPRISE_ID\",\"name\":\"child2\",\"description\":\"Child portfolio 2 - auto-created by GitHub Action\",\"selection\":\"projects\"}" \
            "$BASE/enterprises/portfolios")
          echo "$RESP2"
          CHILD2_ID=$(echo "${RESP2%$'\n'HTTP:*}" | jq -r '.id')
          echo "child2 id: $CHILD2_ID"

          echo "child1_id=$CHILD1_ID" >> "$GITHUB_OUTPUT"
          echo "child2_id=$CHILD2_ID" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------
      # 4. Attempt nesting from the PARENT side: GET already shows an
      #    (empty) "children" array on every portfolio, so try PATCHing
      #    that array with [child1_id, child2_id] instead of setting
      #    parentPortfolioId on the children. Print the result either way
      #    - if this also fails, parent/child1/child2 remain independent
      #    portfolios and the hierarchy needs to be built by hand in the
      #    Sonar UI (or once Sonar ships the feature).
      # ----------------------------------------------------------------
      - name: "4. Attempt nesting via parent.children"
        run: |
          PARENT_ID="${{ steps.parent.outputs.id }}"
          CHILD1_ID="${{ steps.children.outputs.child1_id }}"
          CHILD2_ID="${{ steps.children.outputs.child2_id }}"

          echo "--- PATCH /enterprises/portfolios/$PARENT_ID (children:[child1,child2]) ---"
          curl -s -w "\nHTTP:%{http_code}\n" -X PATCH \
            -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" -H "Content-Type: application/json" \
            -d "{\"children\":[\"$CHILD1_ID\",\"$CHILD2_ID\"]}" \
            "$BASE/enterprises/portfolios/$PARENT_ID"

          echo "--- GET parent portfolio (re-check nesting) ---"
          curl -s -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" "$BASE/enterprises/portfolios/$PARENT_ID" | jq .

      # ----------------------------------------------------------------
      # 5. Split the discovered demo projects in half: first half -> child1,
      #    second half -> child2 ("child2 gets the rest").
      # ----------------------------------------------------------------
      - name: "5. Split demo projects between child1 and child2"
        id: split
        run: |
          KEYS='${{ steps.discover.outputs.project_keys }}'
          echo "All discovered keys: $KEYS"

          HALF=$(echo "$KEYS" | jq '(length / 2 | floor)')
          CHILD1_PROJECTS=$(echo "$KEYS" | jq -c ".[0:$HALF]")
          CHILD2_PROJECTS=$(echo "$KEYS" | jq -c ".[$HALF:]")

          echo "child1 gets: $CHILD1_PROJECTS"
          echo "child2 gets (the rest): $CHILD2_PROJECTS"

          echo "child1_projects=$CHILD1_PROJECTS" >> "$GITHUB_OUTPUT"
          echo "child2_projects=$CHILD2_PROJECTS" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------
      # 6. Assign each half to its portfolio. The correct PATCH field name
      #    for attaching projects isn't documented, so try a few candidate
      #    shapes per portfolio, checking projectCount in the response
      #    after each try, and stop at the first one that actually
      #    attaches something.
      # ----------------------------------------------------------------
      - name: "6. Assign projects to child1 and child2"
        run: |
          assign_projects() {
            local PORTFOLIO_ID="$1"
            local PROJECTS_JSON="$2"   # e.g. ["key1","key2"]
            local LABEL="$3"

            echo "=== Assigning projects to $LABEL ($PORTFOLIO_ID): $PROJECTS_JSON ==="

            # Candidate 1: plain array of key strings.
            echo "--- candidate 1: {\"projects\": [\"key\", ...]} ---"
            RESP=$(curl -s -w "\nHTTP:%{http_code}" -X PATCH \
              -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" -H "Content-Type: application/json" \
              -d "{\"projects\":$PROJECTS_JSON}" \
              "$BASE/enterprises/portfolios/$PORTFOLIO_ID")
            echo "$RESP"
            COUNT=$(echo "${RESP%$'\n'HTTP:*}" | jq -r '.projectCount // 0')
            [ "$COUNT" != "0" ] && [ -n "$COUNT" ] && { echo "$LABEL: candidate 1 worked (projectCount=$COUNT)"; return; }

            # Candidate 2: selection:"manual" + plain array of key strings.
            echo "--- candidate 2: {\"selection\":\"manual\",\"projects\":[...]} ---"
            RESP=$(curl -s -w "\nHTTP:%{http_code}" -X PATCH \
              -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" -H "Content-Type: application/json" \
              -d "{\"selection\":\"manual\",\"projects\":$PROJECTS_JSON}" \
              "$BASE/enterprises/portfolios/$PORTFOLIO_ID")
            echo "$RESP"
            COUNT=$(echo "${RESP%$'\n'HTTP:*}" | jq -r '.projectCount // 0')
            [ "$COUNT" != "0" ] && [ -n "$COUNT" ] && { echo "$LABEL: candidate 2 worked (projectCount=$COUNT)"; return; }

            # Candidate 3: manualProjects field.
            echo "--- candidate 3: {\"manualProjects\":[...]} ---"
            RESP=$(curl -s -w "\nHTTP:%{http_code}" -X PATCH \
              -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" -H "Content-Type: application/json" \
              -d "{\"manualProjects\":$PROJECTS_JSON}" \
              "$BASE/enterprises/portfolios/$PORTFOLIO_ID")
            echo "$RESP"
            COUNT=$(echo "${RESP%$'\n'HTTP:*}" | jq -r '.projectCount // 0')
            [ "$COUNT" != "0" ] && [ -n "$COUNT" ] && { echo "$LABEL: candidate 3 worked (projectCount=$COUNT)"; return; }

            # Candidate 4: projectKeys field.
            echo "--- candidate 4: {\"projectKeys\":[...]} ---"
            RESP=$(curl -s -w "\nHTTP:%{http_code}" -X PATCH \
              -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" -H "Content-Type: application/json" \
              -d "{\"projectKeys\":$PROJECTS_JSON}" \
              "$BASE/enterprises/portfolios/$PORTFOLIO_ID")
            echo "$RESP"
            COUNT=$(echo "${RESP%$'\n'HTTP:*}" | jq -r '.projectCount // 0')
            [ "$COUNT" != "0" ] && [ -n "$COUNT" ] && { echo "$LABEL: candidate 4 worked (projectCount=$COUNT)"; return; }

            # Candidate 5: per-project POST to a /projects sub-resource
            # (only meaningful if the portfolio id itself is valid).
            echo "--- candidate 5: POST /enterprises/portfolios/$PORTFOLIO_ID/projects per project ---"
            for KEY in $(echo "$PROJECTS_JSON" | jq -r '.[]'); do
              curl -s -w "\nHTTP:%{http_code}\n" -X POST \
                -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" -H "Content-Type: application/json" \
                -d "{\"projectKey\":\"$KEY\"}" \
                "$BASE/enterprises/portfolios/$PORTFOLIO_ID/projects"
            done

            echo "::warning::None of the known candidate payload shapes confirmed a nonzero projectCount for $LABEL - check the raw responses above to find the real field name."
          }

          assign_projects "${{ steps.children.outputs.child1_id }}" '${{ steps.split.outputs.child1_projects }}' "child1"
          assign_projects "${{ steps.children.outputs.child2_id }}" '${{ steps.split.outputs.child2_projects }}' "child2"

      # ----------------------------------------------------------------
      # 7. Final verification: print the full state of all 3 portfolios so
      #    it's easy to confirm what actually got created/assigned/nested.
      # ----------------------------------------------------------------
      - name: "7. Final verification"
        run: |
          PARENT_ID="${{ steps.parent.outputs.id }}"
          CHILD1_ID="${{ steps.children.outputs.child1_id }}"
          CHILD2_ID="${{ steps.children.outputs.child2_id }}"

          echo "=== parent ==="
          curl -s -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" "$BASE/enterprises/portfolios/$PARENT_ID" | jq .

          echo "=== child1 ==="
          curl -s -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" "$BASE/enterprises/portfolios/$CHILD1_ID" | jq .

          echo "=== child2 ==="
          curl -s -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" "$BASE/enterprises/portfolios/$CHILD2_ID" | jq .

          echo "Parent portfolio URL: https://sonarqube.us/enterprise/morganstanley/portfolios/$PARENT_ID"
          echo "child1 portfolio URL: https://sonarqube.us/enterprise/morganstanley/portfolios/$CHILD1_ID"
          echo "child2 portfolio URL: https://sonarqube.us/enterprise/morganstanley/portfolios/$CHILD2_ID"
