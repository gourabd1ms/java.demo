# ============================================================================
# Sonar: delete ALL portfolios in the enterprise.
#
# DESTRUCTIVE - this deletes every portfolio returned by the listing
# endpoint below, with no exceptions/allowlist. Only run this deliberately.
#
# Talks to Sonar's Enterprise REST API (host: api.sonarqube.us). Confirmed
# endpoints used here (see sonar-create-portfolio-hierarchy.yml for the
# fuller history of what does/doesn't work on this API):
#
#   - GET /enterprises/portfolios?enterpriseId={id}   -> 200, paginated list
#     of every portfolio in the enterprise. (The bare, no-query-param form
#     returns 400 "Parameter 'enterpriseId' is required unless parameter
#     'favorite' is true" - it's a required-param validation, not the
#     gateway block seen on /enterprises/projects etc.)
#   - DELETE /enterprises/portfolios/{id}             -> 204 on success;
#     confirmed by re-GET returning 404 "portfolio not found".
#
# Step 1 pages through the full list (pageSize 50 per request) so this
# still works correctly if the enterprise ever has more than 50
# portfolios. Step 2 deletes every id collected.
# ============================================================================
name: Sonar Delete All Portfolios

on:
  workflow_dispatch:

jobs:
  delete-all-portfolios:
    runs-on: ubuntu-latest
    env:
      SONAR_ENT_TOKEN: ${{ secrets.SONAR_ENT_TOKEN }}
      BASE: https://api.sonarqube.us
      ENTERPRISE_ID: 896d0782-65b7-4d6f-ac7c-29d00e2ec684
    steps:

      # ----------------------------------------------------------------
      # 1. List every portfolio in the enterprise (paginated).
      # ----------------------------------------------------------------
      - name: "1. List all portfolios"
        id: list
        run: |
          PAGE=1
          ALL_IDS="[]"
          while true; do
            echo "--- GET /enterprises/portfolios?enterpriseId=$ENTERPRISE_ID&p=$PAGE ---"
            RESP=$(curl -s -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" \
              "$BASE/enterprises/portfolios?enterpriseId=$ENTERPRISE_ID&p=$PAGE&ps=50")
            echo "$RESP"

            PAGE_IDS=$(echo "$RESP" | jq -c '[.portfolios[]?.id]')
            PAGE_NAMES=$(echo "$RESP" | jq -r '.portfolios[]? | "\(.id)  \(.name)"')
            echo "$PAGE_NAMES"

            ALL_IDS=$(jq -c -n --argjson a "$ALL_IDS" --argjson b "$PAGE_IDS" '$a + $b')

            TOTAL=$(echo "$RESP" | jq -r '.page.total // 0')
            COLLECTED=$(echo "$ALL_IDS" | jq 'length')
            if [ "$COLLECTED" -ge "$TOTAL" ] || [ "$(echo "$PAGE_IDS" | jq 'length')" = "0" ]; then
              break
            fi
            PAGE=$((PAGE + 1))
          done

          echo "Total portfolios found: $(echo "$ALL_IDS" | jq 'length')"
          echo "portfolio_ids=$ALL_IDS" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------
      # 2. Delete every portfolio collected above.
      # ----------------------------------------------------------------
      - name: "2. Delete every portfolio"
        run: |
          IDS='${{ steps.list.outputs.portfolio_ids }}'
          echo "Deleting: $IDS"

          for ID in $(echo "$IDS" | jq -r '.[]'); do
            echo "--- DELETE /enterprises/portfolios/$ID ---"
            curl -s -w "\nHTTP:%{http_code}\n" -X DELETE \
              -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" \
              "$BASE/enterprises/portfolios/$ID"
          done

      # ----------------------------------------------------------------
      # 3. Verify: list again, expect zero portfolios left.
      # ----------------------------------------------------------------
      - name: "3. Verify all portfolios are gone"
        run: |
          RESP=$(curl -s -H "Authorization: Bearer $SONAR_ENT_TOKEN" -H "accept: application/json" \
            "$BASE/enterprises/portfolios?enterpriseId=$ENTERPRISE_ID&ps=50")
          echo "$RESP" | jq .
          REMAINING=$(echo "$RESP" | jq -r '.page.total // 0')
          if [ "$REMAINING" = "0" ]; then
            echo "All portfolios deleted successfully."
          else
            echo "::warning::$REMAINING portfolio(s) still remain - check the output above."
          fi
